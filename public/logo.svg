<svg width="512" height="512" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-stroke { stroke: #1F6E73; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .icon-fill { fill: #1F6E73; }
      
      @media (prefers-color-scheme: dark) {
        .icon-stroke { stroke: #2dd4bf; }
        .icon-fill { fill: #2dd4bf; }
      }
    </style>
  </defs>
  
  <g transform="translate(0, 7)">
    <!-- Shield left and top -->
    <path class="icon-stroke" stroke-width="12" d="M 60 115 C 10 95, 10 60, 10 35 L 10 25 L 60 10 L 90 20" />
    
    <!-- Arrow Head -->
    <polygon class="icon-fill" points="85,45 130,45 107,10" />
    <path class="icon-stroke" stroke-width="4" d="M 85 45 L 130 45 L 107 10 Z" />
    
    <!-- Right side / Arrow Shaft -->
    <path class="icon-stroke" stroke-width="12" d="M 107 45 L 107 65 C 107 90, 85 105, 60 115" />

    <!-- Brain Network Edges -->
    <path class="icon-stroke" stroke-width="4" d="
      M 35 60 L 50 45 L 70 48 L 85 65 L 75 85 L 55 92 L 40 75 Z
      M 60 65 L 50 45
      M 60 65 L 70 48
      M 60 65 L 85 65
      M 60 65 L 75 85
      M 60 65 L 55 92
      M 60 65 L 40 75
      M 60 65 L 35 60
    " />
    
    <!-- Brain Network Nodes -->
    <circle cx="35" cy="60" r="6" class="icon-fill" />
    <circle cx="50" cy="45" r="6" class="icon-fill" />
    <circle cx="70" cy="48" r="6" class="icon-fill" />
    <circle cx="85" cy="65" r="6" class="icon-fill" />
    <circle cx="75" cy="85" r="6" class="icon-fill" />
    <circle cx="55" cy="92" r="6" class="icon-fill" />
    <circle cx="40" cy="75" r="6" class="icon-fill" />
    <circle cx="60" cy="65" r="6" class="icon-fill" />
  </g>
</svg>
