<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Brain Gradients -->
    <linearGradient id="blueGrad" x1="20" y1="20" x2="110" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a0ff" />
      <stop offset="100%" stop-color="#002d72" />
    </linearGradient>
    <!-- Right Brain Gradients -->
    <linearGradient id="orangeGrad" x1="110" y1="20" x2="190" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#ff2a00" />
    </linearGradient>
    <linearGradient id="textOrangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ff2a00" />
    </linearGradient>
  </defs>

  <!-- Left Hemisphere (Circuit) -->
  <g transform="translate(10, 15)">
    <!-- Base solid blue shape -->
    <path d="M90,110 C60,110 30,95 25,60 C20,30 50,15 75,10 C85,8 90,12 90,20 V110 Z" fill="url(#blueGrad)"/>
    <!-- Circuit lines (cutouts/white lines) -->
    <!-- The actual logo has white/transparent gaps creating the circuits. We can draw thick white lines over the base. -->
    <!-- Alternatively, we can draw the blue parts -->
    <path d="M45,30 L45,60 L65,80 L65,115" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <circle cx="45" cy="30" r="4" fill="white"/>
    
    <path d="M25,55 L35,65 L35,90" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <circle cx="25" cy="55" r="4" fill="white"/>

    <path d="M70,25 L70,45 L85,60 L85,85" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <circle cx="70" cy="25" r="4" fill="white"/>
  </g>

  <!-- Right Hemisphere (Organic) -->
  <g transform="translate(105, 15)">
    <path d="M0,110 C30,110 60,95 65,60 C70,30 40,15 15,10 C5,8 0,12 0,20 V110 Z" fill="url(#orangeGrad)"/>
    <!-- Organic white curves -->
    <path d="M0,25 C15,30 25,40 25,55 C25,70 10,80 0,85" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0,45 C35,50 45,70 20,95" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M25,20 C45,25 55,45 40,65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M10,105 C35,105 45,95 40,80" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="210" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#022d64" letter-spacing="-2">prepare</text>
  <text x="445" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#orangeGrad)" letter-spacing="-1">AI</text>
</svg>
